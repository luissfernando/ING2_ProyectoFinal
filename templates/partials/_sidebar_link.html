{% comment %}Enlace del sidebar. Contexto: url, icono, label, key, seccion (activo si key == seccion), badge (opcional: contador).{% endcomment %}
<a href="{{ url }}"
   {% if key == seccion %}aria-current="page"{% endif %}
   class="group relative flex items-center gap-3 rounded-lg px-3 py-2 transition-colors
          {% if key == seccion %}bg-granate-50 text-granate-700 font-semibold{% else %}text-slate-600 hover:bg-slate-50 hover:text-slate-900{% endif %}">
  {% if key == seccion %}<span class="absolute left-0 top-1.5 bottom-1.5 w-1 rounded-r-full bg-granate-700"></span>{% endif %}
  <i data-lucide="{{ icono }}" class="w-4 h-4 shrink-0 {% if key != seccion %}text-slate-400 group-hover:text-slate-600{% endif %}"></i>
  <span class="flex-1">{{ label }}</span>
  {% if badge %}<span class="shrink-0 rounded-full bg-granate-600 px-2 py-0.5 text-xs font-semibold text-white">{{ badge }}</span>{% endif %}
</a>
