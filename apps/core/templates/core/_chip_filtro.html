{% comment %}Tab/chip de filtro de la bandeja. Contexto: key, label, n, filtro (activo), q, orden.{% endcomment %}
<a href="?filtro={{ key }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if orden and orden != 'antiguedad' %}&orden={{ orden }}{% endif %}"
   {% if filtro == key %}aria-current="true"{% endif %}
   class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition
          {% if filtro == key %}bg-granate-700 text-white{% else %}text-slate-600 hover:bg-slate-100 hover:text-granate-700{% endif %}">
  {{ label }}
  <span class="rounded-full px-1.5 text-xs tabular-nums {% if filtro == key %}bg-white/20 text-white{% else %}bg-slate-100 text-slate-500{% endif %}">{{ n }}</span>
</a>
