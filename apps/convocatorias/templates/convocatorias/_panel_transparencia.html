{% comment %}Panel lateral de transparencia en vivo. Debe ir dentro del <form> con
x-data="formConvocatoria()" para leer pct / estado / proximo / _orden / _labels / puntos.{% endcomment %}
<aside class="lg:sticky lg:top-20">
  <div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm">
    <div class="flex items-end justify-between gap-3">
      <div>
        <p class="text-sm font-semibold text-slate-700">Transparencia</p>
        <p class="text-xs text-slate-500 mt-0.5">Se calcula en vivo.</p>
      </div>
      <span class="text-3xl font-extrabold tabular-nums leading-none"
            :class="pct>=80 ? 'text-exito' : (pct>=50 ? 'text-alerta' : 'text-peligro')"
            x-text="pct + '%'">0%</span>
    </div>

    <div class="mt-3 h-2.5 rounded-full bg-slate-200/80 overflow-hidden">
      <div class="h-full rounded-full transition-all duration-500 ease-out"
           :class="pct>=80 ? 'bg-exito' : (pct>=50 ? 'bg-alerta' : 'bg-peligro')"
           :style="`width: ${pct}%`"></div>
    </div>
    <p class="mt-2 text-xs font-medium"
       :class="pct>=80 ? 'text-exito' : (pct>=50 ? 'text-alerta' : 'text-peligro')"
       x-text="pct>=80 ? 'Nivel alto' : (pct>=50 ? 'Nivel medio' : 'Nivel bajo')"></p>

    {# Los 8 factores, marcándose en vivo #}
    <ul class="mt-4 space-y-2 border-t border-slate-100 pt-4">
      <template x-for="k in _orden" :key="k">
        <li class="flex items-center gap-2.5 text-sm">
          <span class="grid h-5 w-5 shrink-0 place-items-center rounded-full text-[11px] font-bold transition-colors"
                :class="estado[k] ? 'bg-exito text-white' : 'bg-slate-200 text-slate-200'">✓</span>
          <span class="flex-1 leading-snug"
                :class="estado[k] ? 'text-slate-400 line-through decoration-slate-300' : 'text-slate-700'"
                x-text="_labels[k]"></span>
          <span class="shrink-0 text-xs font-semibold tabular-nums"
                :class="estado[k] ? 'text-exito' : 'text-slate-400'"
                x-text="(estado[k] ? '' : '+') + puntos[k] + '%'"></span>
        </li>
      </template>
    </ul>

    <p class="mt-4 flex items-start gap-2 rounded-xl bg-granate-50/70 p-3 text-xs text-granate-800" x-show="proximo" x-cloak>
      <i data-lucide="arrow-up-circle" class="w-4 h-4 shrink-0 mt-0.5"></i><span x-text="proximo"></span>
    </p>
    <p class="mt-4 flex items-center gap-2 rounded-xl bg-exito/10 p-3 text-xs font-medium text-exito" x-show="!proximo" x-cloak>
      <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0"></i> ¡Cumples todos los factores!
    </p>
  </div>
</aside>
